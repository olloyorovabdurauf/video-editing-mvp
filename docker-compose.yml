services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      redis: { condition: service_healthy }

  # One worker per resource profile. Scale `ffmpeg` horizontally first —
  # it's the bottleneck for most workloads.
  worker-io:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.core.celery_app.celery_app worker -Q io -c 4 -l INFO
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      redis: { condition: service_healthy }

  worker-ai:
    build: ./backend
    env_file: ./backend/.env
    # Generative video polling lives here; concurrency is high because the
    # poll task spends most of its life sleeping between HTTP checks.
    command: celery -A app.core.celery_app.celery_app worker -Q ai -c 8 -l INFO
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      redis: { condition: service_healthy }

  worker-ffmpeg:
    build: ./backend
    env_file: ./backend/.env
    # Concurrency=1 because each task pegs a CPU. Scale by replicas, not threads.
    command: celery -A app.core.celery_app.celery_app worker -Q ffmpeg -c 1 -l INFO
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      replicas: 2

  flower:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.core.celery_app.celery_app flower --port=5555
    ports: ["5555:5555"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]
